<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta — yumlist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230e0d0c' rx='8'/><circle cx='11' cy='16' r='8' fill='%23C4622D'/><circle cx='19' cy='16' r='8' fill='%23F5F0E8' fill-opacity='0.15'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0e0d0c; --cream: #F5F0E8; --sand: #B89F87;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--ink); color: var(--cream); font-family: var(--sans); min-height: 100vh; }

.page { max-width: 640px; margin: 0 auto; padding: 18px 20px 60px; }
.loading { text-align: center; padding: 90px 20px; color: rgba(245,240,232,.4); font-size: 14px; }

/* Portada — contenida a propósito: en 390px de ancho debe asomar ya el primer
   plato sin hacer scroll. Ancho completo (sangre), alto corto. Si no hay foto,
   el propio fondo degradado de la marca hace de portada — nunca un hueco. El
   velo va hasta casi opaco donde vive el texto, así el nombre se lee siempre,
   tenga la foto que tenga debajo. */
.hero-cover {
  position: relative; height: 150px; overflow: hidden;
  background:
    radial-gradient(120% 140% at 85% -20%, rgba(196,98,45,.22), transparent 55%),
    linear-gradient(165deg, #201d1a, #0e0d0c);
}
.hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,13,12,0) 0%, rgba(14,13,12,.4) 45%, rgba(14,13,12,.95) 100%); }
.hero-name-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 12px; max-width: 640px; margin: 0 auto; }
.restaurant-name { font-family: var(--serif); font-weight: 300; font-size: 25px; line-height: 1.15; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.55); }
.restaurant-desc { font-size: 13.5px; color: var(--sand); line-height: 1.6; margin: 12px 0 4px; }

@media (min-width: 480px) {
  .hero-cover { height: 200px; }
  .restaurant-name { font-size: 32px; }
}

.menu-tabs { display: flex; gap: 8px; overflow-x: auto; margin: 18px 0 22px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.menu-tab {
  flex-shrink: 0; padding: 9px 18px; border-radius: 100px;
  background: rgba(245,240,232,.05); border: 1px solid rgba(245,240,232,.12);
  color: rgba(245,240,232,.6); font-family: var(--sans); font-size: 13px;
  cursor: pointer; white-space: nowrap; transition: all .15s;
}
.menu-tab.active { background: rgba(245,240,232,.12); border-color: rgba(245,240,232,.3); color: var(--cream); }

.menu-section { margin-top: 26px; margin-bottom: 6px; }
.menu-section:first-child { margin-top: 20px; }
.section-name {
  font-family: var(--serif); font-weight: 300; font-size: 24px; letter-spacing: -.2px;
  margin-bottom: 4px; padding-bottom: 10px; border-bottom: 1px solid rgba(245,240,232,.1);
}

.item-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(245,240,232,.05); }
.item-row:last-child { border-bottom: none; }
.item-row.expandable { cursor: pointer; }
.item-row.expandable:active { background: rgba(245,240,232,.025); }
.item-text { flex: 1; min-width: 0; }
.item-name-price { display: flex; align-items: baseline; gap: 8px; }
.item-name { font-size: 15.5px; color: var(--cream); }
.item-leader { flex: 1; min-width: 10px; border-bottom: 1px dotted rgba(245,240,232,.16); margin-bottom: 4px; }
.item-price { font-family: var(--serif); font-size: 16px; color: rgba(245,240,232,.85); white-space: nowrap; flex-shrink: 0; }
.item-allergens { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.allergen-chip {
  font-size: 9.5px; padding: 2px 7px; border-radius: 20px;
  background: rgba(245,240,232,.05); color: rgba(184,159,135,.85);
  white-space: nowrap; letter-spacing: .01em;
}
.item-detail { margin-top: 10px; }
.item-photo { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; display: block; }
.item-desc { font-size: 13px; color: var(--sand); line-height: 1.6; }

/* Miniatura o chevron: la señal de que el plato se puede tocar. Sin esto no
   la toca nadie y item_expand no dispara nunca. */
.item-thumb-wrap { position: relative; width: 56px; height: 56px; flex-shrink: 0; border-radius: 10px; overflow: hidden; margin-top: 2px; }
.item-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
.item-thumb-badge {
  position: absolute; right: 3px; bottom: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: rgba(14,13,12,.78); display: flex; align-items: center; justify-content: center; color: #F5F0E8;
}
.item-chevron { flex-shrink: 0; color: rgba(245,240,232,.25); font-size: 20px; line-height: 56px; align-self: flex-start; }

.empty-note { text-align: center; padding: 30px 20px; color: rgba(245,240,232,.35); font-size: 13px; }
.empty-state { text-align: center; padding: 50px 20px; }
.empty-state-title { font-family: var(--serif); font-size: 22px; font-weight: 300; margin-bottom: 10px; }
.empty-state-body { font-size: 13px; color: var(--sand); max-width: 320px; margin: 0 auto; line-height: 1.6; }

.not-found { text-align: center; padding: 110px 20px 40px; }
.not-found-logo { margin-bottom: 28px; }

.yumlist-block { margin-top: 44px; padding-top: 30px; border-top: 1px solid rgba(245,240,232,.08); text-align: center; }
.nearby-posts { margin-bottom: 24px; }
.nearby-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(245,240,232,.35); margin-bottom: 10px; }
.nearby-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.nearby-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
.yumlist-logo { margin-bottom: 10px; }
.yumlist-tagline { font-size: 13px; color: var(--sand); margin-bottom: 18px; }
.yumlist-btn {
  display: inline-block; padding: 12px 28px; border-radius: 100px;
  background: rgba(245,240,232,.08); border: 1px solid rgba(245,240,232,.18);
  color: var(--cream); font-family: var(--sans); font-size: 13px; text-decoration: none;
  transition: background .2s;
}
.yumlist-btn:hover { background: rgba(245,240,232,.14); }
.yumlist-privacy { font-size: 10.5px; color: rgba(245,240,232,.25); margin-top: 20px; line-height: 1.6; max-width: 380px; margin-left: auto; margin-right: auto; }
.yumlist-privacy a { color: rgba(245,240,232,.4); }
.yumlist-extra-links { display: flex; justify-content: center; gap: 18px; margin-top: 16px; font-size: 12px; }
.yumlist-extra-links a { color: rgba(245,240,232,.4); text-decoration: none; }
.yumlist-extra-links a:hover { color: var(--cream); }
</style>
</head>
<body>

<div id="root">
  <div class="page"><div class="loading">Cargando carta…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://klkksarpfcohfqirxwoe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtsa2tzYXJwZmNvaGZxaXJ4d29lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNDMwMTUsImV4cCI6MjA4OTYxOTAxNX0.ep8NgjugAIAW07qRdlM4A2ScHEHteDBaRQMOmGKPTtE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Mismo radio que RESTAURANT_PROXIMITY_M en yumlist-app/lib/constants.ts —
// "es sobre este restaurante" se decide igual en toda la plataforma.
const RESTAURANT_PROXIMITY_M = 50;

const ALLERGENS = [
  { slug: 'gluten',         label: 'Gluten' },
  { slug: 'crustaceos',     label: 'Crustáceos' },
  { slug: 'huevos',         label: 'Huevos' },
  { slug: 'pescado',        label: 'Pescado' },
  { slug: 'cacahuetes',     label: 'Cacahuetes' },
  { slug: 'soja',           label: 'Soja' },
  { slug: 'lacteos',        label: 'Lácteos' },
  { slug: 'frutos_cascara', label: 'Frutos de cáscara' },
  { slug: 'apio',           label: 'Apio' },
  { slug: 'mostaza',        label: 'Mostaza' },
  { slug: 'sesamo',         label: 'Sésamo' },
  { slug: 'sulfitos',       label: 'Sulfitos' },
  { slug: 'altramuces',     label: 'Altramuces' },
  { slug: 'moluscos',       label: 'Moluscos' },
];
const ALLERGEN_LABELS = Object.fromEntries(ALLERGENS.map(a => [a.slug, a.label]));

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
}

function fmtPrice(n) { return Number(n).toFixed(2).replace('.', ','); }

function haversineM(la1, lo1, la2, lo2) {
  const R = 6371000, dL = (la2 - la1) * Math.PI / 180, dO = (lo2 - lo1) * Math.PI / 180,
    a = Math.sin(dL / 2) ** 2 + Math.cos(la1 * Math.PI / 180) * Math.cos(la2 * Math.PI / 180) * Math.sin(dO / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function yumlistLogo(size) {
  const w = size || 110;
  return `<svg width="${w}" viewBox="0 0 120 36" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="11" cy="18" r="10" fill="#C4622D"/>
    <circle cx="19" cy="18" r="10" fill="#F5F0E8" fill-opacity="0.1" stroke="#F5F0E8" stroke-width="0.8"/>
    <text x="34" y="24" font-family="'Cormorant Garamond',Georgia,serif" font-size="22" font-weight="300" letter-spacing="-1" fill="#F5F0E8">yumlist</text>
  </svg>`;
}

// La rewrite de vercel.json reescribe /r/<id> a este archivo SIN cambiar la
// URL que ve el navegador (la que está impresa en el QR sigue siendo
// yumlist.app/r/<id>) — por eso el id se lee del pathname, no de un parámetro
// de query. Se probó interpolar :id en la query del destino de la rewrite y
// no llegaba; el pathname es la fuente robusta porque no depende de que
// Vercel reescriba nada dentro del destino, solo de la URL que ya trae el
// navegador. Se mantiene el fallback por ?business= para abrir el archivo
// directamente en pruebas locales.
function getBusinessIdFromUrl() {
  const match = location.pathname.match(/^\/r\/([^/]+)\/?$/);
  if (match) return decodeURIComponent(match[1]);
  return new URLSearchParams(location.search).get('business');
}
const businessId = getBusinessIdFromUrl();

let account = null;
let menus = [], sections = [], items = [];
let activeMenuId = null;
let expandedItemId = null;

let pageStartTime = Date.now();
let pageCloseSent = false;

// Analítica anónima best-effort: un fallo aquí nunca debe romper la lectura
// de la carta, por eso no se espera ni se muestra ningún error al visitante.
async function trackEvent(eventType, metadata) {
  try {
    await sb.rpc('record_carta_event', {
      p_business_id: businessId,
      p_event_type: eventType,
      p_metadata: metadata ?? null,
    });
  } catch (e) {
    console.warn('[carta-publica] trackEvent failed:', eventType, e);
  }
}

// fetch con keepalive (no sendBeacon) para poder mandar las cabeceras de
// Supabase — sendBeacon no permite fijar apikey/Authorization.
function sendPageClose() {
  if (pageCloseSent) return;
  pageCloseSent = true;
  const duration = Math.round((Date.now() - pageStartTime) / 1000);
  try {
    fetch(`${SUPABASE_URL}/rest/v1/rpc/record_carta_event`, {
      method: 'POST',
      keepalive: true,
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ p_business_id: businessId, p_event_type: 'page_close', p_metadata: { duration_seconds: duration } }),
    });
  } catch (e) { /* best-effort */ }
}

function setupPageClose() {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') sendPageClose();
  });
  window.addEventListener('pagehide', sendPageClose);
}

async function init() {
  if (!businessId) { showNotFound(); return; }

  const { data: biz, error } = await sb.from('business_public')
    .select('id, restaurant_name, description, photos, city, lat, lng, instagram, booking_url')
    .eq('id', businessId)
    .maybeSingle();

  if (error || !biz) { showNotFound(); return; }
  account = biz;
  document.title = `${account.restaurant_name || 'Carta'} — yumlist`;

  trackEvent('page_view');
  setupPageClose();

  const { data: menuData } = await sb.from('business_menus')
    .select('*')
    .eq('business_id', businessId)
    .order('sort_order', { ascending: true });
  menus = menuData ?? [];

  if (menus.length === 0) { renderComingSoon(); return; }

  const menuIds = menus.map(m => m.id);
  const { data: sectionData } = await sb.from('business_menu_sections')
    .select('*')
    .in('menu_id', menuIds)
    .order('sort_order', { ascending: true });
  sections = sectionData ?? [];

  if (sections.length > 0) {
    const sectionIds = sections.map(s => s.id);
    const { data: itemData } = await sb.from('business_menu_items')
      .select('*')
      .in('section_id', sectionIds)
      .order('sort_order', { ascending: true });
    // available=false no se muestra — la policy pública no lo filtra (solo
    // filtra por visible de la carta), el filtrado por disponibilidad es aquí.
    items = (itemData ?? []).filter(i => i.available);
  }

  activeMenuId = menus[0].id;
  render();
  trackEvent('menu_tab_view', { menu_id: activeMenuId, menu_name: menus[0].name });
  loadNearbyPosts();
}

// Portada contenida: foto del local si existe, si no el fondo degradado de
// marca ya definido en .hero-cover hace de fallback (nunca queda un hueco).
// El velo (.hero-scrim) garantiza que el nombre se lea con cualquier foto.
function heroHtml() {
  const photo = account.photos?.[0];
  return `
    <div class="hero-cover">
      ${photo ? `<img class="hero-photo" src="${esc(photo)}" alt="" loading="lazy">` : ''}
      <div class="hero-scrim"></div>
      <div class="hero-name-wrap"><h1 class="restaurant-name">${esc(account.restaurant_name || 'Restaurante')}</h1></div>
    </div>`;
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = `
    ${heroHtml()}
    <div class="page">
      ${account.description ? `<p class="restaurant-desc">${esc(account.description)}</p>` : ''}
      ${menus.length > 1 ? `<div class="menu-tabs" id="menu-tabs"></div>` : ''}
      <div id="menu-content"></div>
      <div id="yumlist-footer"></div>
    </div>
  `;
  if (menus.length > 1) renderTabs();
  renderMenuContent();
  renderYumlistFooter();
}

function renderTabs() {
  const wrap = document.getElementById('menu-tabs');
  if (!wrap) return;
  wrap.innerHTML = menus.map(m => `
    <button class="menu-tab${m.id === activeMenuId ? ' active' : ''}" onclick="selectMenu('${m.id}')">${esc(m.name)}</button>
  `).join('');
}

function selectMenu(id) {
  if (id === activeMenuId) return;
  activeMenuId = id;
  expandedItemId = null;
  renderTabs();
  renderMenuContent();
  const menu = menus.find(m => m.id === id);
  trackEvent('menu_tab_view', { menu_id: id, menu_name: menu?.name ?? null });
}

function renderMenuContent() {
  const wrap = document.getElementById('menu-content');
  if (!wrap) return;
  const menuSections = sections.filter(s => s.menu_id === activeMenuId);

  if (menuSections.length === 0) {
    wrap.innerHTML = `<div class="empty-note">Esta carta todavía no tiene platos.</div>`;
    return;
  }

  const html = menuSections.map(s => {
    const sectionItems = items.filter(i => i.section_id === s.id);
    if (sectionItems.length === 0) return '';
    return `
      <div class="menu-section">
        <h2 class="section-name">${esc(s.name)}</h2>
        ${sectionItems.map(renderItemRow).join('')}
      </div>`;
  }).join('');

  wrap.innerHTML = html || `<div class="empty-note">Esta carta todavía no tiene platos.</div>`;
}

const EXPAND_ICON = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>`;

function renderItemRow(it) {
  const priceHtml = it.price != null ? `${fmtPrice(it.price)} €` : (it.price_note ? esc(it.price_note) : '');
  const allergensHtml = (it.allergens ?? []).length
    ? `<div class="item-allergens">${it.allergens.map(a => `<span class="allergen-chip">${esc(ALLERGEN_LABELS[a] ?? a)}</span>`).join('')}</div>`
    : '';
  const expandable = !!(it.description || it.photo_url);
  const isOpen = expandedItemId === it.id;

  // La miniatura (con su insignia de "ampliar") o, si no hay foto pero sí
  // descripción, un chevron — sin alguna de las dos señales, nadie toca la
  // fila y item_expand no se dispara nunca. Al abrir, la miniatura se retira
  // (la foto grande ya vive en item-detail) y queda solo el chevron girado.
  const affordance = (it.photo_url && !isOpen)
    ? `<div class="item-thumb-wrap"><img class="item-thumb" src="${esc(it.photo_url)}" alt="" loading="lazy"><span class="item-thumb-badge">${EXPAND_ICON}</span></div>`
    : (expandable ? `<span class="item-chevron">${isOpen ? '⌃' : '›'}</span>` : '');

  return `
    <div class="item-row${expandable ? ' expandable' : ''}" ${expandable ? `onclick="toggleItem('${it.id}')"` : ''}>
      <div class="item-text">
        <div class="item-name-price">
          <span class="item-name">${esc(it.name)}</span>
          <span class="item-leader"></span>
          <span class="item-price">${priceHtml}</span>
        </div>
        ${allergensHtml}
        ${expandable && isOpen ? `
          <div class="item-detail">
            ${it.photo_url ? `<img class="item-photo" src="${esc(it.photo_url)}" alt="" loading="lazy">` : ''}
            ${it.description ? `<p class="item-desc">${esc(it.description)}</p>` : ''}
          </div>` : ''}
      </div>
      ${affordance}
    </div>`;
}

function toggleItem(id) {
  const wasOpen = expandedItemId === id;
  expandedItemId = wasOpen ? null : id;
  renderMenuContent();
  if (!wasOpen) {
    const it = items.find(i => i.id === id);
    trackEvent('item_expand', { item_id: id, item_name: it?.name ?? null });
  }
}

function renderComingSoon() {
  const root = document.getElementById('root');
  root.innerHTML = `
    ${heroHtml()}
    <div class="page">
      <div class="empty-state">
        <div class="empty-state-title">Estamos preparando la carta</div>
        <p class="empty-state-body">Vuelve pronto — este restaurante todavía está montando su carta digital en yumlist.</p>
      </div>
      <div id="yumlist-footer"></div>
    </div>
  `;
  renderYumlistFooter();
}

function showNotFound() {
  document.getElementById('root').innerHTML = `
    <div class="page">
      <div class="not-found">
        <div class="not-found-logo">${yumlistLogo(130)}</div>
        <div class="empty-state-title">Restaurante no encontrado</div>
        <p class="empty-state-body">Este enlace no corresponde a ningún restaurante en yumlist.</p>
      </div>
    </div>`;
}

function renderYumlistFooter() {
  const wrap = document.getElementById('yumlist-footer');
  if (!wrap) return;
  const extraLinks = [];
  if (account.instagram) {
    const handle = String(account.instagram).replace(/^@/, '');
    extraLinks.push(`<a href="https://instagram.com/${esc(handle)}" target="_blank" rel="noopener">@${esc(handle)}</a>`);
  }
  if (account.booking_url) {
    extraLinks.push(`<a href="${esc(account.booking_url)}" target="_blank" rel="noopener">Reservar</a>`);
  }

  wrap.innerHTML = `
    <div class="yumlist-block">
      <div id="nearby-posts" class="nearby-posts"></div>
      <div class="yumlist-logo">${yumlistLogo(110)}</div>
      <p class="yumlist-tagline">Descubre qué opinan tus amigos de este y otros restaurantes.</p>
      <a class="yumlist-btn" href="https://yumlist.app" target="_blank" rel="noopener" onclick="trackEvent('yumlist_click')">Ir a la app →</a>
      <div class="yumlist-privacy">Medimos visitas de forma anónima y sin cookies, solo para ayudar a este restaurante a entender su carta digital. No usamos identificadores persistentes ni compartimos datos con terceros.</div>
      ${extraLinks.length ? `<div class="yumlist-extra-links">${extraLinks.join('')}</div>` : ''}
    </div>
  `;
}

async function loadNearbyPosts() {
  const el = document.getElementById('nearby-posts');
  if (!el || !account.lat || !account.lng) return;

  const delta = 0.0007; // ~75m de caja, filtro exacto a 50m con Haversine después
  const { data } = await sb.from('posts')
    .select('photo_url, lat, lng')
    .gte('lat', account.lat - delta).lte('lat', account.lat + delta)
    .gte('lng', account.lng - delta).lte('lng', account.lng + delta)
    .not('photo_url', 'is', null)
    .order('created_at', { ascending: false })
    .limit(30);

  if (!data) return;
  const nearby = data.filter(p => p.lat && p.lng && haversineM(account.lat, account.lng, p.lat, p.lng) <= RESTAURANT_PROXIMITY_M);
  // Con 1-2 fotos el bloque queda pobre y puede ser una sola foto irrelevante
  // (un mueble, un detalle sin gracia) — resta credibilidad más de lo que suma.
  // Umbral de 3 antes de mostrar nada.
  if (nearby.length < 3) return;

  el.innerHTML = `
    <div class="nearby-label">Fotos de gente que ha estado aquí</div>
    <div class="nearby-grid">
      ${nearby.slice(0, 6).map(p => `<img src="${esc(p.photo_url)}" alt="" loading="lazy">`).join('')}
    </div>`;
}

init();
</script>
</body>
</html>
