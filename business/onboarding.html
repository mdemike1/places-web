<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E0D0C">
<title>Bienvenido — Yumlist Negocios</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230e0d0c' rx='8'/><circle cx='11' cy='16' r='8' fill='%23C4622D'/><circle cx='19' cy='16' r='8' fill='%23F5F0E8' fill-opacity='0.15'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="business.css">
<style>
  .auth-card { max-width: 520px; }
  .auth-page { align-items: flex-start; padding-top: 64px; padding-bottom: 64px; }
  .welcome-body p { margin-bottom: 16px; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .welcome-body p:last-child { margin-bottom: 0; }
</style>
</head>
<body>


<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <a href="/" style="text-decoration:none">
        <svg width="120" viewBox="0 0 120 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="18" r="10" fill="#C4622D"/>
          <circle cx="19" cy="18" r="10" fill="#F5F0E8" fill-opacity="0.1" stroke="#F5F0E8" stroke-width="0.8"/>
          <text x="34" y="24" font-family="'Cormorant Garamond',Georgia,serif" font-size="22" font-weight="300" letter-spacing="-1" fill="#F5F0E8">yumlist</text>
        </svg>
      </a>
    </div>

    <div id="content">
      <div class="loading">Cargando…</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="business-auth.js"></script>
<script src="onboarding-shared.js"></script>
<script>
// Punto de entrada único del onboarding: registro.html manda aquí siempre, y
// requireBusinessAccount() manda aquí a cualquier cuenta con el onboarding a
// medias desde cualquier página del panel. Esta página nunca es un destino
// "fijo" — o pinta la bienvenida (cuenta recién creada, sin nada rellenado
// todavía) o redirige de inmediato al primer paso incompleto, recalculado
// cada vez a partir de los datos reales, nunca de un paso "grabado".
async function init() {
  const auth = await requireBusinessAccount({ allowIncomplete: true });
  if (!auth) return;
  const { account } = auth;

  const state = await computeOnboardingState(account);

  if (state.complete) {
    window.location.replace('/business/dashboard');
    return;
  }

  const isFresh = !state.hasLocalData && !state.hasPhotos;
  if (!isFresh) {
    // computeOnboardingState() no puede saber si la verificación se saltó o
    // si simplemente no se ha llegado todavía (saltar no deja fila en
    // business_verification_docs) — por eso recalcula 'verificacion' cada
    // vez. Esa marca sí la tenemos, guardada localmente al saltar
    // (ver onboarding-shared.js) — si ya se saltó, el siguiente paso real es
    // la carta, no la misma pantalla que se acaba de descartar.
    let nextStep = state.nextStep;
    if (nextStep === 'verificacion' && wasVerificacionSkipped(account.id)) {
      nextStep = 'carta';
    }
    window.location.replace(stepUrl(nextStep));
    return;
  }

  renderWelcome();
}

function stepUrl(step) {
  if (step === 'perfil') return '/business/perfil?onboarding=1';
  if (step === 'verificacion') return '/business/verificacion?onboarding=1';
  if (step === 'carta') return '/business/carta?onboarding=1';
  return '/business/dashboard';
}

function renderWelcome() {
  document.getElementById('content').innerHTML = `
    <div class="page-label">Panel de negocios</div>
    <h1 class="auth-title">Bienvenido a yumlist</h1>
    <div class="welcome-body" style="margin-top:20px">
      <p>Gracias por registrarte. En unos 15 minutos vas a tener tu perfil listo y tu carta digital funcionando, con un código QR para tus mesas.</p>
      <p>En yumlist las opiniones son de gente que ha estado de verdad en tu restaurante: para publicar hay que hacer una foto del plato y un selfie en el momento. No hay reseñas anónimas ni de gente que nunca ha pisado tu local.</p>
      <p>Puedes parar cuando quieras: guardamos lo que lleves hecho.</p>
    </div>
    <button class="btn-primary" style="margin-top:28px" onclick="location.href='/business/perfil?onboarding=1'">Empezar</button>
  `;
}

init();
</script>
</body>
</html>
